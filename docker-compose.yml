# executr — Coolify "Docker Compose" resource.
# Set the empty/secret values in Coolify's Environment Variables UI.
services:
  executr:
    image: ghcr.io/luiskisters/executr:latest
    # ^ Method B (recommended): prebuilt by CI -> avoids Coolify's compose build-context bugs.
    #   Make the GHCR package pullable by Coolify (set it public, or add a read:packages token).
    #   Method A (let Coolify build): replace the image: line with `build: .` and deploy from the git repo.
    restart: unless-stopped
    environment:
      # --- auth (Coolify secrets; see README) ---
      CLAUDE_CODE_OAUTH_TOKEN: ${CLAUDE_CODE_OAUTH_TOKEN}    # from `claude setup-token` — keeps the Max plan
      GITHUB_TOKEN: ${GITHUB_TOKEN}                          # repo + workflow scope (push + gh pr create)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}                    # only if EXTERNAL_REVIEW=codex via API key
      GROQ_API_KEY: ${GROQ_API_KEY:-}                        # for the (future) voice ask-human
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}            # ralphex notifications
      # --- behavior ---
      REPO_URL: ${REPO_URL:-https://github.com/your-org/your-repo.git}
      REPO_BRANCH: ${REPO_BRANCH:-main}
      EXTERNAL_REVIEW: ${EXTERNAL_REVIEW:-none}              # flip to 'codex' once codex auth is set up
      GIT_AUTHOR_NAME: ${GIT_AUTHOR_NAME:-executr bot}
      GIT_AUTHOR_EMAIL: ${GIT_AUTHOR_EMAIL:-you@example.com}
      RALPHEX_PORT: "8080"
    volumes:
      - executr_repo:/workspace          # persistent clone + docs/plans + .ralphex state
    ports:
      - "8080"                           # Coolify maps a domain to this port

volumes:
  executr_repo:
